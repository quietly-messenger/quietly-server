# Quietly deployment: PostgreSQL + home server + trust service + gateway.
#
# Build from the parent directory (both repos), then:
#   docker compose -f quietly-server/docker-compose.yml up --build
#
# TLS: the server binary supports TLS 1.3 directly via TLS_CERT_FILE /
# TLS_KEY_FILE (mount your certificates), or put a TLS terminator (Caddy,
# nginx) in front of `server`. Do not expose `server` in cleartext: PROTOCOL.md
# §1 requires HTTPS. `trust` and `gateway` are internal-only here; the gateway
# port is bound to localhost until a real federation deployment terminates TLS
# in front of it.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quietly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quietly}
      POSTGRES_DB: ${POSTGRES_DB:-quietly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    restart: "no"

  server:
    build:
      context: ..
      dockerfile: quietly-server/Dockerfile
      args:
        COMPONENT: server
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SERVER_ADDR: "0.0.0.0:8080"
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MESSAGE_TTL_DAYS: ${MESSAGE_TTL_DAYS:-30}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-20}
      BUNDLE_FETCH_PER_HOUR: ${BUNDLE_FETCH_PER_HOUR:-60}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    volumes:
      - ${TLS_DIR:-./tls}:/etc/quietly/tls:ro
    ports:
      - "${SERVER_PORT:-8080}:8080"

  trust:
    build:
      context: ..
      dockerfile: quietly-server/Dockerfile
      args:
        COMPONENT: trust
    restart: unless-stopped
    environment:
      TRUST_PRIVATE_KEY: ${TRUST_PRIVATE_KEY:-}
      TRUST_ADMIN_TOKEN: ${TRUST_ADMIN_TOKEN:?set TRUST_ADMIN_TOKEN for the trust service}
      TRUST_STATE_PATH: /var/lib/quietly/trust-state.json
      TRUST_ADDR: "0.0.0.0:8081"
      TRUST_CERT_DAYS: ${TRUST_CERT_DAYS:-90}
    volumes:
      - trust_state:/var/lib/quietly
    # Internal only: the CA is not reachable from outside the compose network.

  gateway:
    build:
      context: ..
      dockerfile: quietly-server/Dockerfile
      args:
        COMPONENT: gateway
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      trust:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TRUST_PUBLIC_KEY: ${TRUST_PUBLIC_KEY:-}
      TRUST_URL: ${TRUST_URL:-http://trust:8081}
      GATEWAY_ADDR: "0.0.0.0:8082"
      # Same §15 envelope limits as the server (audit F-25).
      MESSAGE_TTL_DAYS: ${MESSAGE_TTL_DAYS:-30}
      SEALED_BLOB_MAX: ${SEALED_BLOB_MAX:-65536}
    ports:
      # Localhost by default: terminate TLS in front before exposing to peers.
      - "127.0.0.1:${GATEWAY_PORT:-8082}:8082"

volumes:
  postgres_data:
    name: quietly_postgres_data
  trust_state:
    name: quietly_trust_state
